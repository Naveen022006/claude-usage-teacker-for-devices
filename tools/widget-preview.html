<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Widget preview</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  Open dist/widget-preview.html after `npm run build`. Query string:
    ?mode=chat|code|floating   which claude.ai layout to imitate (floating = no sidebar, old pill)
    ?theme=dark|light          sidebar colours (claude.ai can be dark while the OS is light)
    ?hub=off                   code mode without a configured hub
-->
<style>
  :root { --bg:#1f1e1d; --fg:#e8e6e3; --hover:#2b2a28; --muted:#9a968f; --line:#33312f; }
  body.light { --bg:#f5f4ee; --fg:#1f1e1d; --hover:#e8e6dc; --muted:#6b6862; --line:#dcd9cd; }
  html, body { margin:0; height:100%; }
  body { font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--fg); }
  .sidebar { width:300px; height:100%; background:var(--bg); border-right:1px solid var(--line); box-sizing:border-box; padding:12px 0; overflow:auto; }
  .sidebar .ttl { padding:4px 20px 10px; font-weight:600; font-size:15px; }
  .sidebar .search { margin:0 14px 8px; height:32px; border:1px solid var(--line); border-radius:8px; padding:0 10px; display:flex; align-items:center; color:var(--muted); }
  .rows { padding:0 8px; }
  .rw { padding:0 0; }
  .rw a { display:flex; align-items:center; gap:10px; height:36px; padding:0 10px; border-radius:8px; color:var(--fg); text-decoration:none; }
  .rw a:hover { background:var(--hover); }
  .ic { width:16px; height:16px; border-radius:4px; border:1.5px solid currentColor; opacity:.7; box-sizing:border-box; }
  .sect { padding:10px 8px 0; }
  .sect .h { padding:6px 10px; font-size:12px; color:var(--muted); }
  .sect a { display:block; padding:7px 10px; border-radius:8px; color:var(--fg); text-decoration:none; font-size:14px; }
  .sect a:hover { background:var(--hover); }
  .note { position:fixed; left:316px; top:12px; font-size:12px; color:var(--muted); width:90px; }
</style>
</head><body>
<div id="mount"></div>
<script>
  (function () {
    var q = new URLSearchParams(location.search);
    var mode = q.get("mode") || "chat", theme = q.get("theme") || "dark", hub = q.get("hub") !== "off";
    if (theme === "light") document.body.classList.add("light");
    window.__claudeUsagePath = mode === "code" ? "/code/session_abc" : "/chat/abc";
    var row = function (label, href) { return '<div class="rw"><div><a href="' + href + '"><span class="ic"></span><span>' + label + '</span></a></div></div>'; };
    var html = "";
    if (mode === "chat") {
      html = '<aside class="sidebar"><nav aria-label="Sidebar"><div class="rows">' +
        row("New", "/new") + row("Projects", "/projects") + row("Artifacts", "/artifacts") + row("Code", "/code") + row("Customize", "/customize") +
        '</div><div class="sect"><div class="h">Pinned</div><a href="/chat/1">Quarterly planning notes</a><a href="/chat/2">Refactor the parser</a>' +
        '<div class="h">Recents</div><a href="/chat/3">Trip ideas</a></div></nav></aside>';
    } else if (mode === "code") {
      html = '<div class="sidebar"><div class="ttl">Claude Code</div><div class="search">Search</div><div class="rows">' +
        row("New", "/code") + row("Projects (Beta)", "/code/projects") + row("Artifacts", "/code/artifacts") + row("Customize", "/code/customize") + row("More", "#") +
        '</div><div class="sect"><div class="h">Recents</div><a href="/code/s1">Fix flaky test</a><a href="/code/s2">Add dark mode</a></div></div>';
    }
    document.getElementById("mount").innerHTML = html;
    if (mode === "floating") document.body.insertAdjacentHTML("beforeend", "<p style='margin:24px'>Floating fallback (no sidebar anchor).</p>");
  })();
</script>
<script>
  // Fake extension APIs so dist/widget.js runs outside Chrome.
  (function () {
    var now = Date.now(), min = 60000, q = new URLSearchParams(location.search);
    var mk = function (s, h, o) {
      s = s.map(Math.round); h = h.map(Math.round); o = o.map(Math.round);
      var sm = { messages: s[0], tokens: s[1] }, hk = { messages: h[0], tokens: h[1] }, op = { messages: o[0], tokens: o[1] };
      var byModel = {};
      if (s[0]) byModel["claude-sonnet-5-5"] = sm;
      if (h[0]) byModel["claude-haiku-4-5"] = hk;
      if (o[0]) byModel["claude-opus-4-5"] = op;
      return { messages: s[0] + h[0] + o[0], promptTokens: Math.round((s[1] + h[1] + o[1]) * 0.7), outputTokens: Math.round((s[1] + h[1] + o[1]) * 0.3), byModel: byModel };
    };
    var windows = function (k) {
      return { today: mk([31 * k, 12400 * k], [12 * k, 4800 * k], [3 * k, 2300 * k]), last5h: mk([14 * k, 6100 * k], [5 * k, 1900 * k], [1 * k, 900 * k]), last7d: mk([180 * k, 71000 * k], [60 * k, 21000 * k], [15 * k, 15000 * k]) };
    };
    var state = {
      device: { deviceId: "me", deviceName: "Chrome" }, aggregates: windows(1),
      accountUsage: { fetchedAt: now, windows: [
        { name: "five_hour", utilization: 42, resetsAt: new Date(now + 134 * min + 5000).toISOString() },
        { name: "seven_day", utilization: 71, resetsAt: new Date(now + 3 * 86400000 + 4 * 3600000 + 12 * min).toISOString() },
        { name: "seven_day_opus", utilization: 92, resetsAt: new Date(now + 2 * 86400000).toISOString() },
        { name: "seven_day_sonnet", utilization: 23, resetsAt: new Date(now + 5 * 86400000).toISOString() } ] },
      syncState: { lastOkAt: now - 20000, lastAttemptAt: now, lastError: null, queue: 0 }, showWidget: true, codeDeviceIds: [], now: now,
      hub: q.get("hub") === "off" ? { configured: false, ok: false, fetchedAt: 0, devices: [] } : { configured: true, ok: true, fetchedAt: now, devices: [
        { deviceId: "me", deviceName: "Chrome", source: "chrome", estimated: true, receivedAt: now, fresh: true, windows: windows(1) },
        { deviceId: "cc", deviceName: "work-laptop", source: "claude-code", estimated: false, receivedAt: now - min, fresh: true, windows: windows(3) },
        { deviceId: "dk", deviceName: "home-pc", source: "desktop", estimated: false, receivedAt: now - 120 * min, fresh: false, windows: windows(0.5) } ] }
    };
    var store = {};
    window.chrome = {
      runtime: { id: "preview",
        sendMessage: function (m) { return Promise.resolve(m.type === "get-widget-state" ? { ok: true, data: Object.assign({}, state, { now: Date.now() }) } : { ok: true, data: null }); },
        onMessage: { addListener: function () {}, removeListener: function () {} } },
      storage: { local: { get: function (k) { var o = {}; if (k in store) o[k] = store[k]; return Promise.resolve(o); }, set: function (o) { Object.assign(store, o); return Promise.resolve(); } },
        onChanged: { addListener: function () {}, removeListener: function () {} } }
    };
  })();
</script>
<script src="widget.js"></script>
</body></html>
